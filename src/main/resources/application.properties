spring.application.name=meditrack
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/meditrack}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
app.jwt.secret=${JWT_SECRET:meditrack-development-secret-change-me-32chars}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
spring.jpa.open-in-view=false
